<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>A MAZE</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#05060B;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);height:100%;width:min(100vw,calc(100vh * 390 / 844))}
#unity-canvas{display:block;width:100%;height:100%;background:#05060B;touch-action:none;outline:none}
#bar{position:absolute;left:20%;right:20%;top:50%;height:10px;background:#1b1d3a;border-radius:6px;overflow:hidden}
#fill{width:0;height:100%;background:#F2C14E}
#err{position:absolute;left:8px;right:8px;top:8px;color:#fff;background:#b00020;padding:8px;display:none;font:14px sans-serif}
</style>
</head>
<body>
<div id="wrap">
<canvas id="unity-canvas" tabindex="1"></canvas>
<div id="bar"><div id="fill"></div></div>
<div id="err"></div>
</div>
<script src="Build/WebGL.loader.js"></script>
<script>
var canvas=document.getElementById("unity-canvas");
createUnityInstance(canvas,{
  arguments:[],
  dataUrl:"Build/WebGL.data.unityweb",
  frameworkUrl:"Build/WebGL.framework.js.unityweb",
  codeUrl:"Build/WebGL.wasm.unityweb",
  streamingAssetsUrl:"StreamingAssets",
  companyName:"SoSunStudios",
  productName:"A MAZE",
  productVersion:"1.0"
},function(p){document.getElementById("fill").style.width=(100*p)+"%";if(p>=1)document.getElementById("bar").style.display="none";})
.then(function(){canvas.focus();})
.catch(function(m){var e=document.getElementById("err");e.style.display="block";e.textContent=String(m);});
</script>
</body>
</html>
